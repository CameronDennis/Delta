name: Build Delta (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # If the build complains about the Xcode version, change this.
  XCODE_VERSION: "16.4"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out repo (with submodules and Git LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app

      - name: Show Xcode version and available schemes
        run: |
          xcodebuild -version
          xcodebuild -list -workspace Delta.xcworkspace

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Delta.xcworkspace \
            -scheme Delta \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show errors from the log if the build failed
        if: failure()
        run: |
          grep -n -E "error:|fatal error|Stack dump|Segmentation fault|Killed|No space left|Please submit a bug" build.log | head -80 || true
          echo "----- last 40 lines -----"
          tail -n 40 build.log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "Delta.app" | head -n 1)
          echo "Found app at: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Delta-fork.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Delta-fork-ipa
          path: Delta-fork.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
