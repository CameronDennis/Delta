name: Build Delta (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Workflow edits and the probe source alone do not start a build;
    # press "Run workflow" in the Actions tab to build them.
    paths-ignore:
      - '.github/**'
      - 'Delta/SteamProbe/**'

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    # Delta's source uses SendableMetatype (Swift 6.2), so it needs Xcode 26.
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out repo (with submodules and Git LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Select newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XC" ]; then echo "No Xcode 26 found on this runner"; exit 1; fi
          echo "Using $XC"
          sudo xcode-select -s "$XC"

      - name: Show Xcode version and available schemes
        run: |
          xcodebuild -version
          xcodebuild -list -workspace Delta.xcworkspace

      - name: Add Steam Controller probe to the project
        run: |
          sudo gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'

          # 1. Compile SteamProbe.swift into the Delta target.
          proj = Xcodeproj::Project.open('Delta.xcodeproj')
          target = proj.targets.find { |t| t.name == 'Delta' }
          abort 'Delta target not found' unless target
          swift_path = 'Delta/SteamProbe/SteamProbe.swift'
          abort "#{swift_path} is missing" unless File.exist?(swift_path)
          already = target.source_build_phase.files_references.compact.any? { |r| r.path.to_s.end_with?('SteamProbe.swift') }
          unless already
            ref = proj.main_group.new_reference(swift_path)
            target.add_file_references([ref])
            proj.save
            puts "Added #{swift_path} to target Delta"
          end

          # 2. Start the probe right after Delta starts monitoring controllers.
          app = 'Delta/AppDelegate.swift'
          src = File.read(app)
          hook = 'ExternalGameControllerManager.shared.startMonitoring()'
          unless src.include?('SteamProbe.shared.install()')
            abort 'hook line not found in AppDelegate' unless src.include?(hook)
            File.write(app, src.sub(hook, "#{hook}\n        SteamProbe.shared.install()"))
            puts 'Patched AppDelegate'
          end

          # 3. Bluetooth needs a usage description or iOS kills the app.
          plist = 'Delta/Supporting Files/Info.plist'
          key = 'NSBluetoothAlwaysUsageDescription'
          unless system('/usr/libexec/PlistBuddy', '-c', "Print :#{key}", plist, out: File::NULL, err: File::NULL)
            system('/usr/libexec/PlistBuddy', '-c', "Add :#{key} string 'Used by the Steam Controller experiment to read the controller.'", plist) or abort 'Info.plist edit failed'
            puts 'Added Bluetooth usage description'
          end
          RUBY

      - name: Add Steam Controller integration
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('Delta.xcodeproj')
          target = proj.targets.find { |t| t.name == 'Delta' }
          abort 'Delta target not found' unless target
          %w[SteamController.swift SteamTouchscreen.swift].each do |file|
            path = "Delta/SteamProbe/#{file}"
            abort "#{path} is missing" unless File.exist?(path)
            already = target.source_build_phase.files_references.compact.any? { |r| r.path.to_s.end_with?(file) }
            next if already
            ref = proj.main_group.new_reference(path)
            target.add_file_references([ref])
            puts "Added #{path} to target Delta"
          end
          proj.save
          app = 'Delta/AppDelegate.swift'
          src = File.read(app)
          unless src.include?('SteamController.shared.start()')
            abort 'probe hook not found' unless src.include?('SteamProbe.shared.install()')
            File.write(app, src.sub('SteamProbe.shared.install()', "SteamProbe.shared.install()\n        SteamController.shared.start()"))
            puts 'Patched AppDelegate for SteamController'
          end
          RUBY

          # DeltaCore keeps controller registration private; add a small public doorway.
          F=$(find . -name ExternalGameControllerManager.swift -path '*DeltaCore*' | head -n 1)
          test -n "$F" || { echo 'ExternalGameControllerManager.swift not found'; exit 1; }
          echo "Patching $F"
          cat >> "$F" <<'SWIFT'

          public extension ExternalGameControllerManager
          {
              func addExternal(_ controller: GameController) { self.add(controller) }
              func removeExternal(_ controller: GameController) { self.remove(controller) }

              var mfiDefaultInputMapping: GameControllerInputMappingProtocol? {
                  guard let fileURL = Bundle.resources.url(forResource: "MFiGameController", withExtension: "deltamapping") else { return nil }
                  return try? GameControllerInputMapping(fileURL: fileURL)
              }
          }
          SWIFT

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Delta.xcworkspace \
            -scheme Delta \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show errors from the log if the build failed
        if: failure()
        run: |
          grep -n -E "error:|fatal error|Stack dump|Segmentation fault|Killed|No space left|Please submit a bug" build.log | head -80 || true
          echo "----- last 40 lines -----"
          tail -n 40 build.log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "Delta.app" | head -n 1)
          echo "Found app at: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Delta-fork.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Delta-fork-ipa
          path: Delta-fork.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
